
<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reservar cita - Psykeros</title><link rel="stylesheet" href="/css/styles.css"></head><body>
<header class="container header"><div class="brand"><img src="/assets/images/logo.png"><div><div style="font-weight:700">Psykeros</div></div></div></header>
<main class="container"><h2>Reservar cita</h2>
<div class="card">
  <form id="bookForm">
    <label>Nombre completo</label><input name="name" required>
    <label>Correo</label><input name="email" type="email" required>
    <label>Teléfono</label><input name="phone" required>
    <label>Servicio</label>
    <select name="service">
      <option value="evaluacion">Evaluación clínica - 1500 MXN</option>
      <option value="supervision">Supervisión de casos - 500 MXN</option>
      <option value="psicoterapia">Psicoterapia individual - 500 MXN</option>
    </select>
    <label>Fecha y hora</label><input type="datetime-local" name="datetime" required>
    <button class="btn" type="submit">Pedir cita</button>
  </form>
</div>
<p class="small-muted">Integración con calendario: Google Calendar (configurable en servidor)</p>
</main><footer class="container footer">© Psykeros</footer><script src="/js/main.js"></script></body></html>
