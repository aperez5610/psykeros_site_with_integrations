
<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contacto - Psykeros</title><link rel="stylesheet" href="/css/styles.css"></head><body>
<header class="container header"><div class="brand"><img src="/assets/images/logo.png"><div><div style="font-weight:700">Psykeros</div></div></div></header>
<main class="container"><h2>Contacto</h2>
<div class="grid-2">
  <div class="card">
    <h4>Escríbenos</h4>
    <form id="contactForm" action="/api/contact" method="post">
      <input name="name" placeholder="Nombre" required>
      <input name="email" placeholder="Correo" required>
      <textarea name="message" placeholder="Mensaje" rows="6" required></textarea>
      <button class="btn" type="submit">Enviar</button>
    </form>
  </div>
  <div class="card">
    <h4>Dirección y mapa</h4>
    <p>Calle Matamoros 500, 3er piso despacho 4, Colonia Centro, Piedras Negras Coahuila, Mexico C.P. 26000</p>
    <p>Tel: +52 8787023641</p>
    <div style="height:220px;background:#eef;border-radius:8px;display:flex;align-items:center;justify-content:center">[Mapa - reemplazar con Google Maps embed]</div>
  </div>
</div>
</main><footer class="container footer">© Psykeros</footer><script src="/js/main.js"></script></body></html>
